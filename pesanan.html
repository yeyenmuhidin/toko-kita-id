<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesanan - Toko Kita ID</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>[hidden]{display:none !important} :focus-visible{outline:2px solid #4338ca;outline-offset:2px}</style>
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <a href="./" class="font-bold text-indigo-700">Toko Kita ID</a>
      <a href="masuk.html" class="text-sm text-indigo-700">Masuk</a>
      <a href="admin.html" class="ml-auto text-sm text-indigo-700">Tinjau</a>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
    <h1 class="text-xl font-bold">Pesanan</h1>
    <p id="pesananBanner" class="text-sm bg-amber-50 border border-amber-200 text-amber-950 rounded-lg p-3"></p>
    <form id="bayarForm" hidden class="bg-white rounded-xl shadow-sm p-4 space-y-3">
      <h2 class="font-semibold">Checkout sandbox</h2>
      <p class="text-sm text-gray-600">Harga dihitung server dari produk yang sudah disetujui. Produk contoh tidak dijual. Ongkir yang belum diatur memblokir pembayaran. Kembali dari halaman bank tidak menandai lunas.</p>
      <label class="block text-sm font-medium" for="catatanKirim">Catatan alamat, bila tarif kirim sudah ada</label>
      <textarea id="catatanKirim" maxlength="300" rows="3" class="w-full border rounded-lg px-3 py-2.5 text-base"></textarea>
      <button class="min-h-11 bg-indigo-600 text-white rounded-lg px-4" type="submit">Buat pesanan</button>
    </form>
    <div id="daftarPesanan" class="space-y-3"></div>
  </main>
  <script src="supabase-config.js"></script>
  <script src="catalog.js"></script>
  <script type="module" src="pesanan.mjs"></script>
</body>
</html>
