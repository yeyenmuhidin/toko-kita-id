<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinjau produk - Toko Kita ID</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>[hidden]{display:none !important} :focus-visible{outline:2px solid #4338ca;outline-offset:2px}</style>
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="./" class="font-bold text-indigo-700">Toko Kita ID</a>
      <a href="masuk.html" class="ml-auto text-sm text-indigo-700">Masuk</a>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
    <h1 class="text-xl font-bold">Tinjauan admin</h1>
    <p id="adminBanner" class="text-sm bg-amber-50 border border-amber-200 text-amber-950 rounded-lg p-3"></p>
    <p id="lencanaPesanan" class="text-sm font-medium"></p>
    <div id="antrean" class="space-y-3"></div>
    <h2 class="font-semibold">Pesanan</h2>
    <label class="block text-sm" for="saringStatus">Status pembayaran</label>
    <select id="saringStatus" class="border rounded-lg px-3 py-2 text-base">
      <option value="">Semua</option>
      <option value="menunggu_pembayaran">Menunggu pembayaran</option>
      <option value="dibayar">Dibayar</option>
      <option value="gagal">Gagal</option>
      <option value="kedaluwarsa">Kedaluwarsa</option>
    </select>
    <div id="daftarPesananAdmin" class="space-y-3"></div>
  </main>
  <script src="supabase-config.js"></script>
  <script src="catalog.js"></script>
  <script type="module" src="admin.mjs"></script>
</body>
</html>
